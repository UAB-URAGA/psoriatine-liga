<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Psoriatic Arthritis Inforgaphics</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overscroll-behavior: none;
      touch-action: none;
      background: #000;
    }
    #unity-container, #unity-canvas {
      position: fixed;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left);
    }
    #unity-canvas {
      width: 100dvw;
      height: 100dvh;
      display: block;
    }
    #unity-loading-bar {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(420px, 80dvw);
      z-index: 5;
      display: none;
    }
    #unity-logo { width: 100%; height: 90px; background: url('TemplateData/unity-logo-dark.png') no-repeat center/contain; margin-bottom: 12px; }
    #unity-progress-bar-empty { width: 100%; height: 18px; background: rgba(255,255,255,0.15); border-radius: 9px; overflow: hidden; }
    #unity-progress-bar-full { width: 0%; height: 100%; background: #4af; }
    #fs {
      position: fixed;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 10;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 10px 14px;
      font: 500 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      backdrop-filter: blur(6px);
    }
    #rotate-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      z-index: 9999;
      text-align: center;
      padding: 24px;
      font: 600 18px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .unity-mobile #unity-canvas { image-rendering: -webkit-optimize-contrast; }
  </style>
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <div id="rotate-overlay">Please rotate your device to landscape.</div>
  <button id="fs" type="button">Fullscreen</button>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var rotateOverlay = document.getElementById('rotate-overlay');

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build.data",
      frameworkUrl: buildUrl + "/Build.framework.js",
      codeUrl: buildUrl + "/Build.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Uraga",
      productName: "Psoriatic Arthritis Inforgaphics",
      productVersion: "0.2.1"
    };

	if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
	  config.devicePixelRatio = window.devicePixelRatio;
	  container.classList.add("unity-mobile");
	} else {
	  canvas.style.width = "100%";
	  canvas.style.height = "100%";
	}

    function resizeCanvasToDisplaySize() {
      const rect = canvas.getBoundingClientRect();
      const cssWidth = Math.round(rect.width);
      const cssHeight = Math.round(rect.height);
      if (canvas.width !== cssWidth || canvas.height !== cssHeight) {
        canvas.width = cssWidth;
        canvas.height = cssHeight;
      }
    }

    function updateOrientationOverlay() {
      var isPortrait = window.matchMedia("(orientation: portrait)").matches;
      rotateOverlay.style.display = isPortrait ? 'flex' : 'none';
    }

    window.addEventListener('resize', function () {
      //resizeCanvasToDisplaySize();
      updateOrientationOverlay();
    });

    window.addEventListener('orientationchange', function () {
      setTimeout(function () {
        //resizeCanvasToDisplaySize();
        updateOrientationOverlay();
      }, 200);
    });

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      //resizeCanvasToDisplaySize();
      updateOrientationOverlay();

      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
        document.getElementById('fs').addEventListener('click', async function () {
          try {
            if (canvas.requestFullscreen) await canvas.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
              try { await screen.orientation.lock('landscape'); } catch (e) {}
            }
          } catch (e) {}
        });
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
